<!-- The opening animation (02-splash.css): the name written in one stroke with the orb dropping in as its last o
     (src/brand/freeflo-orb.js, inlined by build.mjs where the marker below sits; the season colours the orb, a holiday turns it into the holiday);
     once per load, under 1.2 s (or, once a day, the longer
     full-screen opening sequence: 78-anim-wire.js), never blocks input (pointer-events: none;
     while the sequence holds it takes only the click that skips it; any key skips it too),
     skipped under reduced motion / Off. -->
<div class="od-splash" id="od-splash" aria-hidden="true">
  <div class="od-sp-in"></div>
</div>
<!--@freeflo-orb-->
<script>
/* The splash: gone at once under reduced motion / Off; otherwise it fades out once the app has
   loaded (no earlier than 640 ms, no later than 900 ms, so it is over by 1.2 s), and any click
   or key skips it. It never takes input (pointer-events: none).
   The opening sequence (78-anim-wire.js animOpeningSequence): on the first load of the day (or
   every load; Settings > Animations > Opening, mirrored here as dashboard-opening-mode) the splash
   holds, and the app chains "Welcome to <county>" and the county's scene onto it. A click or any
   key still skips the lot; a safety timer ends it if the app never takes over. Opening off: no splash. */
(function () {
  var sp = document.getElementById('od-splash');
  if (!sp) return;
  var lv = null, legacy = null, s = '', mode = 'daily', last = '';
  try { lv = localStorage.getItem('dashboard-motion-level'); legacy = localStorage.getItem('dashboard-motion'); s = localStorage.getItem('dashboard-state-v1') || '';
    mode = localStorage.getItem('dashboard-opening-mode') || 'daily'; last = localStorage.getItem('dashboard-opening-day') || ''; } catch (e) { /* storage blocked */ }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || lv === 'off' || mode === 'off' || (!lv && legacy === 'reduced') || /[?&#]nosplash/.test(location.href)) { sp.remove(); return; }
  var m = /"theme":"(dark|light)"/.exec(s.length < 4e6 ? s : '');
  var dark = m ? m[1] === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) sp.classList.add('is-dark');
  var d = new Date(), day = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  var hold = mode === 'every' || last !== day;
  if (hold) { sp.classList.add('is-hold'); try { localStorage.setItem('dashboard-opening-day', day); } catch (e) { /* storage blocked */ } }
  try { sp.querySelector('.od-sp-in').innerHTML = FreefloBrand.lockup({ intro: true, speed: hold ? 1 : 0.62 }); }   // the orb for today (season or holiday)
  catch (e) { sp.querySelector('.od-sp-in').textContent = 'Freeflo'; }
  // The clock starts at the first painted frame (the page's scripts may block the thread first,
  // and the CSS intro only starts when it is painted).
  var t0 = 0, gone = false, ready = false;
  function out(fast) {
    if (gone) return; gone = true;
    sp.classList.add(fast ? 'is-skip' : 'is-out');
    setTimeout(function () { sp.remove(); }, fast ? 160 : hold ? 760 : 320);   // holding: a slower crossfade into the app (02-splash.css)
    removeEventListener('pointerdown', skip, true); removeEventListener('keydown', skip, true);
  }
  function skip() { out(true); }
  function maybe() { var t = performance.now() - t0; if (ready && t >= 640) out(false); else setTimeout(maybe, ready ? 640 - t : 60); }
  window.__odOpening = { hold: hold, day: day, out: out, t0: function () { return t0 || performance.now(); }, gone: function () { return gone; } };
  addEventListener('pointerdown', skip, true); addEventListener('keydown', skip, true);
  document.addEventListener('DOMContentLoaded', function () { ready = true; });
  requestAnimationFrame(function () {
    t0 = performance.now();
    // Four seconds for a fresh device fix, then the complete scene/event chain.
    if (hold) { setTimeout(function () { out(false); }, 16000); return; }
    setTimeout(maybe, 640);
    setTimeout(function () { out(false); }, 900);
  });
})();
</script>
