# Release: pushing a tag vX.Y.Z (or vX.Y.Z-pre) builds the clean export,
# scans it, packages it, proves the zip builds (no test suite: removed 23 Oct 2026), and
# publishes a GitHub release with the zip, SHA256SUMS.txt, its Ed25519
# signature SHA256SUMS.txt.sig (secret RELEASE_SIGNING_KEY; the in-app updater
# refuses an unsigned release from 2.19.8 on) and the changelog section as
# notes. How to cut a release: docs/dev/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the release and upload its files
  id-token: write        # build provenance (signed attestation of the zip)
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CLI_PATH: ${{ github.workspace }}/.no-claude-cli/claude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Version from the tag
        id: v
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Privacy scan of the repository (generic rules)
        run: node tools/privacy-scan.mjs --no-terms

      - name: Export the release tree
        run: node tools/release-export.mjs --out "$RUNNER_TEMP/opendash"

      - name: Privacy scan of the export (generic rules)
        run: node tools/privacy-scan.mjs "$RUNNER_TEMP/opendash" --no-terms

      - name: Package, extract and build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          # The built-in app registrations go into the zip only (tools/release-client-ids.mjs);
          # repository secrets, never committed. A secret that is not set leaves its placeholder.
          OPENDASH_MICROSOFT_CLIENT_ID: ${{ secrets.OPENDASH_MICROSOFT_CLIENT_ID }}
          OPENDASH_GOOGLE_CLIENT_ID: ${{ secrets.OPENDASH_GOOGLE_CLIENT_ID }}
          OPENDASH_GOOGLE_CLIENT_SECRET: ${{ secrets.OPENDASH_GOOGLE_CLIENT_SECRET }}
        run: >-
          node tools/release-package.mjs
          --from "$RUNNER_TEMP/opendash"
          --version "$VERSION"
          --out "$RUNNER_TEMP/dist"
          --check-package-version
          --client-ids
          --no-tests

      - name: Sign the checksums
        env:
          # The Ed25519 private key (PKCS#8 PEM). Missing or not matching the public key pinned in
          # lib/updater.mjs: the release stops here (the app would refuse it anyway).
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node tools/release-sign.mjs "$RUNNER_TEMP/dist/SHA256SUMS.txt"

      - name: Build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/dist/opendash-v${{ steps.v.outputs.version }}.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        shell: bash
        run: |
          if [ "$PRERELEASE" = "true" ]; then latest=(--prerelease); else latest=(--latest); fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/opendash-v$VERSION.zip" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt.sig" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Freeflo v$VERSION" \
            --notes-file "$RUNNER_TEMP/dist/release-notes.md" \
            --verify-tag \
            "${latest[@]}"

  # The one-click Windows installer: wraps the release zip that the job above
  # just published (so it has the same files and client IDs) plus a pinned,
  # checksum-verified portable Node.js. The zip and its SHA256SUMS.txt are not
  # touched (the in-app updater reads them); the installer's checksum goes in
  # its own SHA256SUMS-installer.txt.
  installer:
    name: Windows installer for ${{ github.ref_name }}
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Build the installer from the published zip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $dl = Join-Path $env:RUNNER_TEMP 'dl'
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $dl --pattern "opendash-v$version.zip" --pattern 'SHA256SUMS.txt' --pattern 'SHA256SUMS.txt.sig'
          if ($LASTEXITCODE -ne 0) { throw 'could not download the release zip' }
          node tools/release-sign.mjs --verify (Join-Path $dl 'SHA256SUMS.txt')
          if ($LASTEXITCODE -ne 0) { throw 'the release checksums are not signed by the release key' }
          $want = ((Get-Content (Join-Path $dl 'SHA256SUMS.txt') | Select-Object -First 1) -split '\s+')[0].ToLower()
          $got = (Get-FileHash (Join-Path $dl "opendash-v$version.zip") -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "zip checksum mismatch: $want vs $got" }
          $src = Join-Path $env:RUNNER_TEMP 'src'
          Expand-Archive (Join-Path $dl "opendash-v$version.zip") -DestinationPath $src
          $out = Join-Path $env:RUNNER_TEMP 'installer-out'
          & installer/build-installer.ps1 -SourceDir (Join-Path $src "opendash-v$version") -Version $version -OutDir $out
          $exe = "OpenDash-Setup-$version.exe"
          $hash = (Get-FileHash (Join-Path $out $exe) -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path (Join-Path $out 'SHA256SUMS-installer.txt') -Value "$hash  $exe" -Encoding ascii
          node tools/release-sign.mjs (Join-Path $out 'SHA256SUMS-installer.txt')
          if ($LASTEXITCODE -ne 0) { throw 'could not sign the installer checksum' }
          gh release upload $env:GITHUB_REF_NAME (Join-Path $out $exe) (Join-Path $out 'SHA256SUMS-installer.txt') (Join-Path $out 'SHA256SUMS-installer.txt.sig') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not upload the installer' }
