# CI: on every push and pull request, check that OpenDash builds and run the
# privacy scan (generic rules). One quick job; there is no test suite (the
# owner removed it on 23 Oct 2026: it cost far more than it found).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Syntax check
        run: node build.mjs --syntax

      - name: Build
        run: node build.mjs

      - name: Privacy scan (generic rules)
        run: node tools/privacy-scan.mjs --no-terms
